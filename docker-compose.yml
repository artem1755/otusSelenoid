services:

  selenoid1:
    image: aerokube/selenoid:latest
    container_name: selenoid1
    hostname: selenoid1
    ports:
      - "4444:4444"
    networks:
      - selenoid_net1
    environment:
      - DOCKER_API_VERSION=1.49
    volumes:
      #      - //var/run/docker.sock://var/run/docker.sock
      - /var/run/docker.sock:/var/run/docker.sock
      - ./local/browser.json:/etc/selenoid/browsers.json:ro
      - ./logs/selenoid1:/opt/selenoid/logs
    shm_size: 2g
    command: [
      "-limit", "5",
      "-container-network", "selenoid_net1",
      "-log-output-dir", "/opt/selenoid/logs",
      "-capture-driver-logs",
      "-save-all-logs"
    ]


  selenoid-ui:
    image: aerokube/selenoid-ui:latest
    container_name: selenoid-ui
    hostname: selenoid-ui
    ports:
      - "8080:8080"
    networks:
      - selenoid_net1
    command: ["--selenoid-uri", "http://selenoid1:4444"]


networks:
  selenoid_net1:
    name: selenoid_net1